<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新增书签 · 方案 B</title>
<style>
:root{
  color-scheme:dark;
  --page:#1b1b1d; --win-border:#2c2c2a; --win-shadow:0 30px 80px -20px rgba(0,0,0,.7); --panel:#141415;
  --bg:#090A0C; --surface:#30302e; --surface-hover:#3a3936; --input:#21211f;
  --fg:#faf9f5; --fg-muted:#b7b5ad; --fg-faint:#75746d;
  --accent:#e0875f; --accent-hover:#ea9670; --accent-subtle:#3a2a22; --on-accent:#1a120d; --knob-on:#fff;
  --accent-border:rgba(224,135,95,.42); --accent-ring:rgba(224,135,95,.2);
  --border:#3e3e3a; --border-soft:rgba(62,62,58,.7);
  --lt-red:#ff5f57; --lt-yellow:#febc2e; --lt-green:#28c840;
  --radius:14px; --radius-md:11px; --radius-sm:8px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
  color-scheme:light;
  --page:#e4e2dc; --win-border:rgba(0,0,0,.12); --win-shadow:0 30px 80px -24px rgba(25,15,9,.28); --panel:#f5f3ee;
  --bg:#faf9f5; --surface:#f0eee6; --surface-hover:#e8e6db; --input:#ffffff;
  --fg:#1f1e1d; --fg-muted:#6c6b64; --fg-faint:#a4a299;
  --accent:#d97757; --accent-hover:#c25f3c; --accent-subtle:#f3e7e0; --on-accent:#fff; --knob-on:#fff;
  --accent-border:#e2b59f; --accent-ring:rgba(217,119,87,.18);
  --border:#e6e3d9; --border-soft:rgba(230,227,217,.9);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#e4e2dc; --win-border:rgba(0,0,0,.12); --win-shadow:0 30px 80px -24px rgba(25,15,9,.28); --panel:#f5f3ee;
  --bg:#faf9f5; --surface:#f0eee6; --surface-hover:#e8e6db; --input:#ffffff;
  --fg:#1f1e1d; --fg-muted:#6c6b64; --fg-faint:#a4a299;
  --accent:#d97757; --accent-hover:#c25f3c; --accent-subtle:#f3e7e0; --on-accent:#fff; --knob-on:#fff;
  --accent-border:#e2b59f; --accent-ring:rgba(217,119,87,.18);
  --border:#e6e3d9; --border-soft:rgba(230,227,217,.9);
}
/* 主题切换（窗口外） */
.theme-sw{position:fixed;top:16px;right:16px;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--input);border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.theme-sw button{width:26px;height:24px;border:0;border-radius:6px;background:none;color:var(--fg-faint);display:grid;place-items:center;cursor:pointer}
.theme-sw button:hover{color:var(--fg)}
.theme-sw button.on{background:var(--surface);color:var(--fg)}
.theme-sw svg{width:14px;height:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);transition:background-color .2s;display:grid;place-items:center;font-family:var(--font-sans);color:var(--fg);-webkit-font-smoothing:antialiased}
.win{width:900px;height:640px;background:var(--bg);border-radius:12px;border:1px solid var(--win-border);box-shadow:var(--win-shadow);display:flex;flex-direction:column;overflow:hidden}
/* 标题栏 */
.tb{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border-soft)}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:var(--lt-red)}.lights i:nth-child(2){background:var(--lt-yellow)}.lights i:nth-child(3){background:var(--lt-green)}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;margin-left:6px;color:var(--on-accent)}
.logo svg{width:13px;height:13px}
.search{flex:1;max-width:420px;margin:0 auto;height:28px;border-radius:var(--radius-sm);background:var(--input);border:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--fg-faint);font-size:12.5px}
.search kbd{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint)}
.tb-act{display:flex;gap:2px}
.ib{width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--fg-muted);background:none;border:0;cursor:pointer}
.ib:hover{background:var(--surface)}
.ib.on{color:var(--accent)}
.ib svg{width:16px;height:16px}

/* 内容 */
.main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.left{display:flex;flex-direction:column;gap:12px;padding:22px 24px;min-height:0}
.right{background:var(--panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;min-height:0}
.field{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--fg);font:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus,.field:focus-within{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-ring)}
.field::placeholder{color:var(--fg-faint)}
.url{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px}
.url svg{width:16px;height:16px;color:var(--fg-faint);flex:none}
.url input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-family:var(--font-mono);font-size:13px}
.url input::placeholder{color:var(--fg-faint);font-family:var(--font-sans)}
.head{display:flex;gap:14px;align-items:center;padding:6px 0 2px}
.fav{width:56px;height:56px;flex:none;border-radius:var(--radius);background:var(--surface);border:1px dashed var(--border);display:grid;place-items:center;cursor:pointer}
.fav:hover{border-color:var(--accent-border)}
.fav img{width:32px;height:32px;border-radius:8px}
.title{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--border);border-radius:0;height:44px;font-size:20px;font-weight:600;padding:0 2px;color:var(--fg);outline:none;font-family:inherit}
.title:focus{border-color:var(--accent)}
.title::placeholder{color:var(--fg-faint)}
.note{flex:1;width:100%;min-height:0;padding:12px 14px;resize:none;line-height:1.6;font-size:13.5px}

.r-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.r-head span{font-size:12px;letter-spacing:.06em;color:var(--fg-faint);font-weight:500}
.multi{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-muted);cursor:pointer;user-select:none}
.sw{width:28px;height:16px;border-radius:8px;background:var(--surface-hover);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--fg-muted);transition:transform .15s,background .15s}
.multi.on{color:var(--fg)}
.multi.on .sw{background:var(--accent)}
.multi.on .sw::after{transform:translateX(12px);background:var(--knob-on)}
.list{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.grp{display:flex;align-items:center;gap:6px;width:100%;padding:8px 8px 4px;font-size:11.5px;color:var(--fg-faint);font-weight:600;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left}
.grp svg{width:12px;height:12px;transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.grp em{font-style:normal;margin-left:auto;color:var(--accent);font-weight:500}
.items.closed{display:none}
.it{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--radius-sm);border:0;background:none;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.it:hover{background:var(--surface)}
.mk{width:16px;height:16px;flex:none;border:1.5px solid var(--fg-faint);border-radius:50%;display:grid;place-items:center}
.multi-on .mk{border-radius:5px}
.it.on{background:var(--accent-subtle);color:var(--accent)}
.it.on .mk{border-color:var(--accent);background:var(--accent)}
.it.on .mk::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--on-accent)}
.multi-on .it.on .mk::after{width:8px;height:4px;border-radius:0;background:none;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.it.add{color:var(--fg-muted)}
.it.add:hover{color:var(--accent)}
.it.add .mk{border:0;font-size:16px;line-height:1}
.it-input{height:32px;width:100%;padding:0 10px;font-size:13px;border-radius:var(--radius-sm)}
.r-foot{display:flex;gap:8px;padding:12px 16px 16px}
.btn{flex:1;height:38px;border-radius:var(--radius-md);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface-hover)}
.btn.pri{flex:1.6;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover)}
.btn svg{width:15px;height:15px}
</style>
</head>
<body>
<div class="theme-sw" id="themeSw">
  <button data-t="light" title="浅色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button data-t="dark" title="深色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
  <button data-t="system" title="跟随系统"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
</div>
<script>
(()=>{
  const root=document.documentElement, sw=document.getElementById('themeSw'), KEY='gm-proto-theme';
  const apply=t=>{
    if(t==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t);
    sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  };
  apply(localStorage.getItem(KEY)||'system');
  sw.onclick=e=>{const b=e.target.closest('button'); if(!b) return; localStorage.setItem(KEY,b.dataset.t); apply(b.dataset.t);};
})();
</script>
<div class="win">
  <header class="tb">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      搜索书签<kbd>⌘K</kbd>
    </div>
    <div class="tb-act">
      <button class="ib" title="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="ib on" title="固定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg></button>
    </div>
  </header>

    <main class="main">
    <section class="left">
      <label class="field url">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <input value="https://github.com/search?q={q}" placeholder="链接或 {q} 搜索模板" autofocus>
      </label>
      <div class="head">
        <div class="fav" title="更换图标"><img alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23faf9f5'/><path fill='%23111' d='M12 4a8 8 0 0 0-2.5 15.6c.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-3.9 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.6 7.6 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.5.8.5 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 12 4z'/></svg>"></div>
        <input class="title" value="GitHub 代码搜索" placeholder="标题">
      </div>
      <textarea class="field note" placeholder="简介 / 笔记">在 GitHub 上按关键词搜索仓库、代码与 Issue。</textarea>
    </section>
    <aside class="right">
      <div class="r-head"><span>文件夹</span><div class="multi" id="multi"><span>多选</span><span class="sw"></span></div></div>
      <div class="list" id="list"></div>
      <div class="r-foot">
        <button class="btn">取消</button>
        <button class="btn pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>保存</button>
      </div>
    </aside>
  </main>
</div>
<script>
const groups = [
  {name:'Mark', folders:['默认','Ponte-mini','Ponte-mac','设计灵感']},
  {name:'开发', folders:['前端','Rust','工具链']},
  {name:'阅读', folders:['稍后读','论文']},
];
const closed = new Set();
let multi=false; const sel=new Set(['0:默认']);
const listEl=document.getElementById('list'), multiEl=document.getElementById('multi');
function render(){
  listEl.classList.toggle('multi-on',multi);
  listEl.innerHTML = groups.map((g,i)=>{
    const n=g.folders.filter(f=>sel.has(i+':'+f)).length;
    const c=closed.has(i)?'closed':'';
    return `<button class="grp ${c}" data-g="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>${g.name}${n?`<em>${n}</em>`:''}</button>
    <div class="items ${c}">${g.folders.map(f=>`<button class="it ${sel.has(i+':'+f)?'on':''}" data-k="${i}:${f}"><span class="mk"></span>${f}</button>`).join('')}
    <button class="it add" data-add="${i}"><span class="mk">+</span>新建</button></div>`;
  }).join('');
}
listEl.onclick=e=>{
  const g=e.target.closest('.grp'); if(g){const i=+g.dataset.g; closed.has(i)?closed.delete(i):closed.add(i); render(); return;}
  const it=e.target.closest('.it'); if(!it) return;
  if(it.dataset.add!==undefined){ startNew(it,+it.dataset.add); return; }
  const k=it.dataset.k;
  if(multi){ sel.has(k)&&sel.size>1?sel.delete(k):sel.add(k); } else { sel.clear(); sel.add(k); }
  render();
};
multiEl.onclick=()=>{
  multi=!multi; multiEl.classList.toggle('on',multi);
  if(!multi&&sel.size>1){const f=[...sel][0]; sel.clear(); sel.add(f);}
  render();
};
function startNew(btn,gi){
  const inp=document.createElement('input'); inp.className='field it-input'; inp.placeholder='文件夹名';
  btn.replaceWith(inp); inp.focus();
  let fin=false;
  const done=ok=>{ if(fin) return; fin=true;
    const v=inp.value.trim();
    if(ok&&v&&!groups[gi].folders.includes(v)){ groups[gi].folders.push(v); const k=gi+':'+v; if(!multi) sel.clear(); sel.add(k); }
    render();
  };
  inp.onkeydown=e=>{ if(e.key==='Enter') done(true); if(e.key==='Escape') done(false); };
  inp.onblur=()=>done(true);
}
render();
</script>
</body>
</html>
