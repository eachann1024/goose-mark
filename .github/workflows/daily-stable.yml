name: Daily stable uTools release

on:
  schedule:
    # 08:00 Asia/Shanghai; GitHub may start later when runners are queued.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a stable GitHub Release after validation
        required: true
        type: boolean
        default: false
      force:
        description: 忽略版本和指纹判断，强制编译
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stable-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable stable release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            python3 .github/scripts/stable-release.py prepare --force-build
          else
            python3 .github/scripts/stable-release.py prepare
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      commit: ${{ steps.prepare.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable stable release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG: ${{ needs.check.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          python3 .github/scripts/stable-release.py prepare --force-build
          python3 - <<'PY'
          import os
          from pathlib import Path
          expected_tag = os.environ['EXPECTED_TAG']
          expected_commit = os.environ['EXPECTED_COMMIT']
          values = {}
          for line in Path(os.environ['GITHUB_OUTPUT']).read_text().splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  values[key] = value
          if values.get('tag') != expected_tag or values.get('commit') != expected_commit:
              raise SystemExit('prepare tag/commit mismatch with check')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Check frontend types
        run: bun run type-check
      - name: Build production uTools plugin
        run: bun run build
      - name: Verify plugin manifests and production files
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          for name in ['dist']:
              directory = Path(name).resolve()
              manifest = json.loads((directory / 'plugin.json').read_text())
              required = ['preload', 'logo']
              if name != 'dist-quicknote':
                  required.append('main')
              else:
                  assert (directory / 'quicknote.html').is_file(), name
              for key in required:
                  value = manifest.get(key)
                  assert isinstance(value, str) and value, (name, key)
                  target = (directory / value).resolve()
                  assert target.is_relative_to(directory) and target.is_file(), (name, key)
              assert json.loads((directory / 'package.json').read_text())['type'] == 'commonjs', name
              assert not list(directory.rglob('*.map')), name
          PYTHON
      - name: Package independent plugin directories
        run: python3 .github/scripts/stable-release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: stable-release-${{ github.sha }}
          path: .stable-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    if: >-
      needs.check.outputs.should_build == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stable-release-${{ github.sha }}
          path: .stable-release/
      - name: Publish verified stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_ALLOWED: 'true'
        run: python3 .github/scripts/stable-release.py publish
