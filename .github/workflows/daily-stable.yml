name: Daily stable uTools release

on:
  schedule:
    # 08:00 Asia/Shanghai; GitHub may start later when runners are queued.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a stable GitHub Release after validation
        required: true
        type: boolean
        default: false
      force:
        description: 忽略版本和指纹判断，强制编译
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stable-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      should_build: ${{ steps.prepare.outputs.should_build }}
      commit: ${{ steps.prepare.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare immutable stable release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            python3 .github/scripts/stable-release.py prepare --force-build
          else
            python3 .github/scripts/stable-release.py prepare
          fi
      - name: Use preinstalled Node 22
        id: node
        if: steps.prepare.outputs.build == 'true'
        shell: bash
        run: |
          cur="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
          if [ "$cur" -ge 22 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            node_bin="$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"/node/22.*/*/bin 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$node_bin" ] && [ -x "$node_bin/node" ]; then
              echo "$node_bin" >> "$GITHUB_PATH"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Setup Node 22 fallback
        if: steps.prepare.outputs.build == 'true' && steps.node.outputs.found != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: steps.prepare.outputs.build == 'true'
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        if: steps.prepare.outputs.build == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        if: steps.prepare.outputs.build == 'true'
        run: bun install
      - name: Type-check and build production uTools plugin
        if: steps.prepare.outputs.build == 'true'
        run: |
          rc=0
          bun run type-check &
          pid_tc=$!
          bun run build &
          pid_build=$!
          wait "$pid_tc" || rc=$?
          wait "$pid_build" || rc=$?
          exit "$rc"
      - name: Verify plugin manifests and production files
        if: steps.prepare.outputs.build == 'true'
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          for name in ['dist']:
              directory = Path(name).resolve()
              manifest = json.loads((directory / 'plugin.json').read_text())
              required = ['preload', 'logo']
              if name != 'dist-quicknote':
                  required.append('main')
              else:
                  assert (directory / 'quicknote.html').is_file(), name
              for key in required:
                  value = manifest.get(key)
                  assert isinstance(value, str) and value, (name, key)
                  target = (directory / value).resolve()
                  assert target.is_relative_to(directory) and target.is_file(), (name, key)
              assert json.loads((directory / 'package.json').read_text())['type'] == 'commonjs', name
              assert not list(directory.rglob('*.map')), name
          PYTHON
      - name: Package independent plugin directories
        if: steps.prepare.outputs.build == 'true'
        run: python3 .github/scripts/stable-release.py package
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.build == 'true'
        with:
          name: stable-release-${{ github.sha }}
          path: .stable-release/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      needs.build.outputs.build == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stable-release-${{ github.sha }}
          path: .stable-release/
      - name: Publish verified stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_ALLOWED: 'true'
        run: python3 .github/scripts/stable-release.py publish
