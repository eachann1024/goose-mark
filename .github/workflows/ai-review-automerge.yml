# AI 审核使用 Codex CLI 与 CODEX_AUTH_JSON（ChatGPT 登录），参考鹅笔记。
# 审核只读默认分支脚本和 PR diff，不检出、不执行 PR 代码。
# fork PR 不跑审核，也不下发 CODEX_AUTH_JSON。
# 仓库主人的同仓库 PR 在 safe_to_merge 时可以越过非密钥受保护路径并自动合并。
# workflow_dispatch 仅验收审核结果，不触发合并、评论或标签。
# Secret 缺失、审核异常或输出不合法时失败。审核 JSON 只走产物，不进 job output。

name: AI review & auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '同仓库 PR 编号（只读验收，可选已关闭 PR）'
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || format('validation-{0}', inputs.pr_number) }}
  cancel-in-progress: true

env:
  AUTOMERGE_LABEL: bot-automerge          # 非主人路径要有这个标签才自动合并；主人的 safe_to_merge 不需要
  BLOCK_LABEL: needs-human                # 不合并时打的标签
  ALLOWED_AUTHORS: eachann1024            # 逗号分隔；只合并这些作者的 PR
  ALLOW_CAUTION: "true"                   # merge_with_caution 不是致命问题，默认放行（用户口径：没有致命问题就合并）
  CHECKS_TIMEOUT_MIN: "20"                # 等其他 CI 的上限，超时不合并
  # 动到这些路径默认转人工（审核/CI 配置、部署配置）。规则：以 / 结尾=任意层级目录；以 * 开头=后缀；其他=文件名前缀
  # 仓库主人 eachann1024 的同仓库 PR（head.repo.full_name == github.repository），且审核结论为 safe_to_merge 时：
  # 不要求 bot-automerge，即使改到这些路径也 squash 自动合并。
  # 密钥材料始终不自动合并，打 needs-human：.env、secrets、credentials、*.pem、*.key、*.p12、id_rsa。
  # 其他作者或 fork 保持原行为（受保护路径 -> needs-human）。本工作流不检出、不执行 fork 代码，也不把 CODEX_AUTH_JSON 交给 fork PR。
  # 仓库有其他部署配置（如自定义 deploy 脚本目录）就追加到这里
  PROTECTED_PATHS: ".github/,.pr_agent.toml,.gemini/,.coderabbit.yaml,.greptile/,.env,secrets,credentials,*.pem,*.key,*.p12,id_rsa,deploy/,vercel.json,netlify.toml,fly.toml,wrangler.toml,render.yaml,Dockerfile,docker-compose,compose.yaml,compose.yml,Procfile,deploy.sh"

jobs:
  review:
    name: ai-review
    # 只审同仓库分支、作者是仓库主人的非草稿 PR（作者名与 env.ALLOWED_AUTHORS 保持一致）；labeled 事件只在加的是自动合并标签时才触发
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout review script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Codex review (ChatGPT login)
        id: pragent
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/gate-review.json"
      # 审核结果只走产物。不要写 job output：Actions 会打出
      # "Skip output 'review' since it may contain secret" 并丢掉整段 JSON，闸门就会拿到空结果。
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: gate-review
          path: ${{ runner.temp }}/gate-review.json
          if-no-files-found: error


  validate:
    name: ai-review-validation
    # 手动验收仅生成审核结果；不调用合并闸门、不写评论或标签。
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve owned same-repository PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pr, repo = os.environ['PR'], os.environ['REPO']
          if not re.fullmatch(r'[1-9][0-9]*', pr):
              raise SystemExit('PR 编号不合法')
          info = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr}'], text=True))
          if info['user']['login'] != 'eachann1024' or (info['head'].get('repo') or {}).get('full_name') != repo:
              raise SystemExit('只允许仓库主人的同仓库 PR')
          sha = info['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('PR 提交不合法')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')
          PY
      - name: Validate Codex review (read-only)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/validated-review.json"
          {
            echo '## Codex 审核验收'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/validated-review.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-validation
          path: ${{ runner.temp }}/validated-review.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ai-merge-gate
    needs: review
    # review 失败/超时也要进来打标签（被新提交取消的旧运行不进来），只处理同仓库 PR
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # 合并 + 删除分支
      pull-requests: write   # 打标签、评论
      issues: write
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Download review result
        if: needs.review.result == 'success'
        # 下载失败也进入判定步骤，用产物缺失的真实原因失败，而不是把空字符串当成审核结果。
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-review
          path: ${{ runner.temp }}/gate-review
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time

          env = os.environ
          repo, pr, sha = env["REPO"], env["PR"], env["HEAD_SHA"]
          label, block = env["AUTOMERGE_LABEL"], env["BLOCK_LABEL"]

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  print(r.stderr, file=sys.stderr)
                  raise SystemExit(f"gh {' '.join(args[:3])} failed")
              return r.stdout

          def api(path):
              return json.loads(gh("api", path))

          def short(s, n=120):
              s = " ".join(str(s).split())
              return s if len(s) <= n else s[:n - 1] + "…"

          def safe_excerpt(text, n=180):
              text = re.sub(
                  r"-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]+?-----END [A-Z ]*PRIVATE KEY-----",
                  "[redacted]", str(text))
              # Authorization: Bearer <凭据> 必须整段去掉，不能只替换 Bearer 这个词
              text = re.sub(
                  r"(?i)\b(authorization|proxy-authorization)\b\s*[:=]\s*(?:bearer\s+)?\S+",
                  r"\1 [redacted]", text)
              text = re.sub(r"(?i)\bbearer\s+\S+", "bearer [redacted]", text)
              # JSON 会写成 "token":"值" 或 "access_token": "值"，字段名和值之间有引号
              key = r"access_token|refresh_token|id_token|api[_-]?key|client[_-]?secret|password|passwd|secret|token|authorization|credential"
              text = re.sub(
                  rf'(?i)(?<![A-Za-z0-9_])["\']?(?:{key})["\']?\s*:\s*"(?:\\.|[^"\\])*"',
                  '"[redacted]"', text)
              text = re.sub(
                  rf"(?i)(?<![A-Za-z0-9_])[\"']?(?:{key})[\"']?\s*:\s*'(?:\\.|[^'\\])*'",
                  "'[redacted]'", text)
              text = re.sub(
                  rf"(?i)(?<![A-Za-z0-9_])(?:{key})\s*[:=]\s*\S+",
                  "[redacted]", text)
              text = re.sub(r"\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{4,}", "[redacted]", text)
              text = re.sub(r"\b(?:ghp_|github_pat_|sk-|AKIA)[A-Za-z0-9_\-]{6,}", "[redacted]", text)
              text = " ".join(text.split())
              if not text:
                  return "（空）"
              return text if len(text) <= n else text[:n - 1] + "…"

          def last_verdict_object(text):
              # Codex 有时会输出多个 JSON 或在对象后多写几行；json.loads 会报 Extra data。
              # 取最后一个带 merge_recommendation 的完整对象。
              decoder = json.JSONDecoder()
              found = []
              idx, n = 0, len(text)
              while idx < n:
                  while idx < n and text[idx] not in "{[":
                      idx += 1
                  if idx >= n:
                      break
                  try:
                      obj, end = decoder.raw_decode(text, idx)
                  except json.JSONDecodeError:
                      idx += 1
                      continue
                  if isinstance(obj, dict) and "merge_recommendation" in obj:
                      found.append(obj)
                  idx = end
              return found[-1] if found else None

          def verdict(review):
              if not review:
                  return "无审核结果"
              return f"{review.get('merge_recommendation', '?')} / 风险 {review.get('risk_level', '?')}"

          def block_merge(reasons):
              gh("label", "create", block, "-R", repo, "--color", "B60205",
                 "--description", "AI 闸门判定需要人工处理", check=False)
              gh("api", "-X", "POST", f"repos/{repo}/issues/{pr}/labels", "-f", f"labels[]={block}", check=False)
              # 结论行已写了建议和风险，要点里优先放具体原因
              reasons = sorted(reasons, key=lambda r: r.startswith(("合并建议为", "风险等级为")))
              lines = [f"- {short(r)}" for r in reasons[:3]]
              if len(reasons) > 3:
                  lines.append(f"- 另有 {len(reasons) - 3} 条，见 Actions 运行摘要")
              body = (f"### 🤖 自动合并已拦截\n结论：{verdict(review)}\n" + "\n".join(lines) +
                      f"\n\n审核提交：`{sha[:7]}`")
              gh("pr", "comment", pr, "-R", repo, "--body", body, check=False)
              print("BLOCKED:", reasons)
              sys.exit(0)

          review_path = os.path.join(env.get("RUNNER_TEMP", ""), "gate-review", "gate-review.json")
          review = {}
          parse_excerpt = None
          artifact_missing = not os.path.isfile(review_path)
          if artifact_missing:
              # 先只记录。打标签和评论必须等确认 PR 仍打开且 head 未变。
              review = {}
          else:
              text = open(review_path, encoding="utf-8").read()
              parsed = last_verdict_object(text)
              if parsed is None:
                  review = None
                  parse_excerpt = safe_excerpt(text)
              else:
                  review = parsed
          # 详细结论只写进 Actions 运行摘要，不发评论；解析失败只留脱敏摘录
          try:
              with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  if isinstance(review, dict):
                      body = json.dumps(review, ensure_ascii=False, indent=2)[:60000]
                  else:
                      body = "无法解析审核产物。摘录：" + (parse_excerpt or "（空）")
                  fh.write("## AI 审核结论\n\n```\n" + body + "\n```\n")
          except Exception:
              pass

          info = api(f"repos/{repo}/pulls/{pr}")
          labels = {l["name"] for l in info["labels"]}
          author = info["user"]["login"]
          head_repo = ((info.get("head") or {}).get("repo") or {}).get("full_name")
          rec_now = ""
          if isinstance(review, dict):
              rec_now = str(review.get("merge_recommendation", "")).strip()
          # 主人 + 同仓库 + safe_to_merge：不要求 bot-automerge，非密钥受保护路径也可合并。
          owner_safe = author == "eachann1024" and head_repo == repo and rec_now == "safe_to_merge"
          allowed = {a.strip() for a in env["ALLOWED_AUTHORS"].split(",") if a.strip()}
          # 产物缺失时先确认这条运行仍然对应当前 PR，再打标签或评论。过期运行静默跳过。
          if artifact_missing and env.get("REVIEW_RESULT") == "success":
              if info["state"] != "open" or info["head"]["sha"] != sha:
                  print("PR closed or head moved; skip missing artifact")
                  sys.exit(0)
              if author not in allowed or head_repo != repo or (label not in labels and not owner_safe):
                  print("missing artifact outside the merge path; skip")
                  sys.exit(0)
              parent = os.path.dirname(review_path)
              if os.path.isdir(parent):
                  detail = "目录内容：" + ", ".join(sorted(os.listdir(parent))[:20])
              else:
                  detail = "产物目录不存在"
              msg = (
                  "AI 审核任务已成功，但闸门没有找到审核产物 gate-review/gate-review.json。"
                  "审核 JSON 不再经过 job output 传递（Actions 会因疑似密钥丢弃 output）；"
                  "产物缺失时无法判断，请检查 upload-artifact 与 download-artifact。"
                  f"（{detail}）"
              )
              print(msg, file=sys.stderr)
              gh("label", "create", block, "-R", repo, "--color", "B60205",
                 "--description", "AI 闸门判定需要人工处理", check=False)
              gh("api", "-X", "POST", f"repos/{repo}/issues/{pr}/labels",
                 "-f", f"labels[]={block}", check=False)
              gh("pr", "comment", pr, "-R", repo, "--body",
                 f"### 🤖 自动合并已拦截\n{msg}\n\n审核提交：`{sha[:7]}`", check=False)
              sys.exit(1)
          if label not in labels and not owner_safe:
              print("no automerge label; review only"); sys.exit(0)
          if info["state"] != "open" or info["head"]["sha"] != sha:
              print("PR closed or head moved; a newer run will handle it"); sys.exit(0)

          reasons = []
          if author not in allowed or head_repo != repo:
              # 不是仓库主人的同仓库 PR：只审不合，也不发评论。fork 不会执行到合并。
              print("author or head repo not allowed; review only"); sys.exit(0)

          # 1) 审核本身必须成功且有结构化结果（超时/报错/无输出 = 不合并）
          if env["REVIEW_RESULT"] != "success":
              reasons.append(f"AI 审核未成功完成（{env['REVIEW_RESULT']}），按规则不自动合并")
          if review is None:
              review = {}
              reasons.append(
                  "AI 审核输出无法解析，没有带 merge_recommendation 的完整 JSON："
                  + (parse_excerpt or "（空）"))
          elif not review:
              reasons.append("没有拿到 AI 审核的结构化结果")
          else:
              rec = str(review.get("merge_recommendation", "")).strip()
              risk = str(review.get("risk_level", "")).strip().lower()
              # Actions 把 PR-Agent YAML 里的 No 编进 output JSON 时会变成布尔 false，不能当安全疑虑
              sec_raw = review.get("security_concerns", None)
              if isinstance(sec_raw, bool):
                  sec_text = "true" if sec_raw else "false"
                  sec_clear = not sec_raw
              else:
                  sec_text = str(sec_raw or "").strip()
                  low = sec_text.lower()
                  sec_clear = low.startswith("no") or low in {"false", "none", "null"}
              ok_recs = {"safe_to_merge"} | ({"merge_with_caution"} if env["ALLOW_CAUTION"] == "true" else set())
              if rec not in ok_recs:
                  reasons.append(f"合并建议为 `{rec or '缺失'}`")
              if risk not in {"low", "medium"}:
                  reasons.append(f"风险等级为 `{risk or '缺失'}`")
              if sec_raw is None or (not isinstance(sec_raw, bool) and not sec_text):
                  reasons.append("安全审查字段缺失")
              elif not sec_clear:
                  reasons.append(f"存在安全疑虑：{sec_text[:300]}")
              # 安全/鉴权/计费/数据/迁移类意见一律转人工
              issues = review.get("key_issues_to_review") or []
              if not isinstance(issues, list):
                  issues = []
              # 不用裸「安全」：建议里的「并发安全/线程安全」不是安全漏洞
              fatal_kw = re.compile(
                  r"安全漏洞|安全隐患|安全问题|安全风险|不安全|安全性|漏洞|注入|泄露|密钥|令牌|凭据|鉴权|认证|授权|越权|权限|计费|扣费|支付|账单|"
                  r"数据(丢失|损坏|泄露|删除|清空|覆盖)|丢数据|迁移|schema|"
                  r"\b(security|vulnerab\w*|injection|secret|credential|authn|authz|authenticat\w*|authoriz\w*|"
                  r"permission|billing|payment|migration|data loss|corrupt\w*)\b", re.I)
              for it in issues:
                  if isinstance(it, dict):
                      text = f"{it.get('issue_header', '')} {it.get('issue_content', '')}"
                      if fatal_kw.search(text):
                          reasons.append("审核意见涉及安全/鉴权/计费/数据/迁移：" + str(it.get("issue_header", ""))[:120])
              if rec == "changes_required":
                  for it in issues:
                      if isinstance(it, dict):
                          reasons.append("要改：" + short(f"{str(it.get('relevant_file', '')).strip()} "
                                                       f"{str(it.get('issue_header', '')).strip()}：{it.get('issue_content', '')}"))
          if any("security" in l.lower() for l in labels):
              reasons.append("PR 带有安全疑虑标签")

          # 2) 敏感路径转人工。主人的 safe_to_merge 可越过非密钥受保护路径；密钥材料始终拦截。
          SECRET_PATHS = [".env", "secrets", "credentials", "*.pem", "*.key", "*.p12", "id_rsa"]
          files = json.loads(gh("api", "--paginate", "--slurp", f"repos/{repo}/pulls/{pr}/files?per_page=100"))
          names = [f["filename"] for page in files for f in page]
          prot = [p.strip() for p in env["PROTECTED_PATHS"].split(",") if p.strip()]
          def protected(n, p):
              base = n.rsplit("/", 1)[-1]
              if p.endswith("/"):
                  return ("/" + n).find("/" + p) >= 0
              if p.startswith("*"):
                  return n.endswith(p[1:])
              return base.startswith(p)
          def is_secret(n):
              if any(protected(n, p) for p in SECRET_PATHS):
                  return True
              # 目录名同样算密钥材料，避免 .github/secrets/token.json 被主人豁免放行
              for seg in n.split("/")[:-1]:
                  if any(protected(seg, p) for p in SECRET_PATHS):
                      return True
              return False
          secret_hit = [n for n in names if is_secret(n)]
          hit = [n for n in names if any(protected(n, p) for p in prot)]
          other_hit = [n for n in hit if n not in set(secret_hit)]
          if secret_hit:
              reasons.append("改动了密钥材料路径，不自动合并：" + ", ".join(secret_hit[:10]))
          if other_hit and not owner_safe:
              reasons.append("改动了受保护路径：" + ", ".join(other_hit[:10]))

          if reasons:
              block_merge(reasons)

          # 3) 等同一提交上的其他检查全部结束且全绿（排除本 workflow 自己的 job）
          own = {"ai-review", "ai-merge-gate"}
          deadline = time.time() + int(env["CHECKS_TIMEOUT_MIN"]) * 60
          while True:
              runs = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100")["check_runs"]
              runs = [r for r in runs if r["name"] not in own]
              status = api(f"repos/{repo}/commits/{sha}/status")
              pending = [r["name"] for r in runs if r["status"] != "completed"] + \
                        [s["context"] for s in status["statuses"] if s["state"] == "pending"]
              bad = [f"{r['name']}={r['conclusion']}" for r in runs
                     if r["status"] == "completed" and r["conclusion"] not in ("success", "skipped", "neutral")] + \
                    [f"{s['context']}={s['state']}" for s in status["statuses"] if s["state"] in ("failure", "error")]
              if bad:
                  block_merge(["其他检查未通过：" + ", ".join(bad[:10])])
              if not pending:
                  break
              if time.time() > deadline:
                  block_merge([f"等待检查超过 {env['CHECKS_TIMEOUT_MIN']} 分钟（{', '.join(pending[:10])}），超时不合并"])
              time.sleep(30)

          # 4) 可合并状态
          for _ in range(10):
              info = api(f"repos/{repo}/pulls/{pr}")
              if info["mergeable"] is not None:
                  break
              time.sleep(6)
          if info["head"]["sha"] != sha:
              print("head moved while waiting; skip"); sys.exit(0)
          if info["mergeable"] is not True:
              block_merge([f"PR 当前不可合并（mergeable={info['mergeable']}, state={info.get('mergeable_state')}），可能有冲突"])

          # 5) 合并：--match-head-commit 保证合并的就是审核过的那个提交
          r = subprocess.run(["gh", "pr", "merge", pr, "-R", repo, "--squash", "--delete-branch",
                              "--match-head-commit", sha], capture_output=True, text=True)
          if r.returncode != 0:
              block_merge([f"合并调用失败：{(r.stderr or r.stdout).strip()[:300]}"])
          gh("pr", "comment", pr, "-R", repo, "--body",
             f"✅ AI 审核通过（{verdict(review)}），已自动合并 `{sha[:7]}`", check=False)
          print("MERGED", repo, pr, sha)
          PY
